# Activate with: --spring.profiles.active=postgresql
# OVMJ_DB_USERNAME and OVMJ_DB_PASSWORD are intentionally required and have no defaults.
spring.datasource.url=${OVMJ_DB_URL:jdbc:postgresql://${OVMJ_DB_HOST:127.0.0.1}:${OVMJ_DB_PORT:5432}/${OVMJ_DB_NAME:mahjong}}
spring.datasource.username=${OVMJ_DB_USERNAME}
spring.datasource.password=${OVMJ_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# First startup creates the account/session/player tables. In controlled production,
# switch OVMJ_DB_DDL_AUTO to validate after schema provisioning or use migrations.
spring.jpa.hibernate.ddl-auto=${OVMJ_DB_DDL_AUTO:update}
