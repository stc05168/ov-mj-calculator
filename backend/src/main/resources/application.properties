# Common server settings and the zero-setup local H2 profile.
# Secrets must be supplied through environment variables; do not commit real credentials.
server.port=${PORT:8080}

spring.datasource.url=${OVMJ_DB_URL:jdbc:h2:file:${OVMJ_DATA_PATH:./data/mahjong};AUTO_SERVER=TRUE}
spring.datasource.username=${OVMJ_DB_USERNAME:sa}
spring.datasource.password=${OVMJ_DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

# Creates missing tables and updates compatible columns for local/dev use.
spring.jpa.hibernate.ddl-auto=${OVMJ_DB_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.h2.console.enabled=${OVMJ_H2_CONSOLE_ENABLED:false}

app.allowed-origins=${OVMJ_ALLOWED_ORIGINS:http://127.0.0.1:8000,http://localhost:8000}
app.token-days=${OVMJ_TOKEN_DAYS:30}
