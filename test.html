<style>

<body>
<h1>🀄 Mahjong Hand Type Test Suite</h1>
<div id="controls"><button id="run-btn" onclick="runAllTests()">Run All Tests</button></div>
<div id="summary"></div>
<script id="test-completion" type="application/json"></script>
<table id="results"><thead><tr><th>#</th><th>Case ID / Hand Type</th><th>Score</th><th>Result</th><th>Hand Setup</th></tr></thead><tbody></tbody></table>

<script src="mjConst.js"></script>
<script>
// ===== State & getAllTiles (from mj.js, no DOM needed) =====
const state = {
    handTiles:[], flowers:[], chows:[], pungs:[], openKongs:[], concealedKongs:[],
    winningTile:null, seatWind:'東', roundWind:'東', isDealer:false, dealerCount:0,
    isSelfDraw:false, isDeclaredReady:false, isIppatsu:false, isLastTileDraw:false,
    isLastDiscard:false, isFlowerDraw:false, isKongDraw:false, isRobbingKong:false,
    isDoubleKongDraw:false, isRobbingDoubleKong:false, isTenhou:false, isChihou:false,
    isTenReady:false, isChiReady:false, isFaceDown:false, isMultiWin:0,
    isMultiWinSelfDraw:false, visibleWinTileCount:0, history:[]
};
function getAllTiles(){
    const t=[...state.handTiles];
    state.chows.forEach(c=>t.push(...c.tiles));
    state.pungs.forEach(p=>t.push(...p.tiles));
    state.openKongs.forEach(k=>t.push(...k.tiles));
    state.concealedKongs.forEach(k=>t.push(...k.tiles));
    if(state.winningTile) t.push(state.winningTile);
    return t;
}
</script>
<script src="checkHandType.js"></script>
<script>
// ===== Tile Helpers =====
function mt(type,value){
    const cssMap={'萬子':'character','索子':'bamboo','筒子':'dot','字牌':'honor','花牌':'flower'};
    return{type,value,display:`${type}-${value}`,cssClass:`tile-${cssMap[type]||''}-${value}`};
}
function w(v){return mt(TILE_TYPES.CHARACTERS,v)}
function s(v){return mt(TILE_TYPES.BAMBOOS,v)}
function t(v){return mt(TILE_TYPES.DOTS,v)}
function h(v){return mt(TILE_TYPES.HONORS,v)}
function fl(v){return{type:TILE_TYPES.FLOWERS,value:v,display:`flower-${v}`,cssClass:'flower'}}
function mkPung(fn,v){return{tiles:[fn(v),fn(v),fn(v)],type:fn(v).type,value:v}}
function mkChow(fn,a,b,c){return{tiles:[fn(a),fn(b),fn(c)],type:fn(a).type,value:a}}
function mkKong(fn,v){return{tiles:[fn(v),fn(v),fn(v),fn(v)],type:fn(v).type,value:v}}

function resetState(){
    state.handTiles=[];state.flowers=[];state.chows=[];state.pungs=[];
    state.openKongs=[];state.concealedKongs=[];state.winningTile=null;
    state.seatWind='東';state.roundWind='東';state.isDealer=false;state.dealerCount=0;
    state.isSelfDraw=false;state.isDeclaredReady=false;state.isIppatsu=false;
    state.isLastTileDraw=false;state.isLastDiscard=false;state.isFlowerDraw=false;
    state.isKongDraw=false;state.isRobbingKong=false;state.isDoubleKongDraw=false;
    state.isRobbingDoubleKong=false;state.isTenhou=false;state.isChihou=false;
    state.isTenReady=false;state.isChiReady=false;state.isFaceDown=false;
    state.isMultiWin=0;state.isMultiWinSelfDraw=false;state.visibleWinTileCount=0;
}

// Base valid hand: 5 chows + pair = 17 tiles, no exposed melds
function baseHand(){
    return{ht:[w(2),w(3),w(4),w(6),w(7),w(8),s(2),s(3),s(4),s(6),s(7),s(8),t(2),t(3),t(4),t(5)],wt:t(5)};
}
function applyBase(b){
    state.handTiles=[...b.ht];state.winningTile=b.wt?{...b.wt}:null;
}

// TEST-DEFINITIONS-BEGIN
// ===== Test Definitions =====
const TEST_SCHEMA_VERSION='mahjong-test-result/v1';
const T=[];
function add(name,score,desc,setup,options={}){
    const ordinal=T.length+1;
    const id=options.id||`canonical-${String(ordinal).padStart(3,'0')}`;
    if(T.some(test=>test.id===id))throw new Error(`Duplicate test id: ${id}`);
    const required=options.required||[{name,score,matcher:'exact',minCount:1,maxCount:1}];
    T.push({
        id,name,score,desc,setup,required,
        prohibited:options.prohibited||[],
        traceCandidates:!!options.traceCandidates,
        seed:options.seed||null,
        category:options.category||'canonical',
        preservation:!!options.preservation,
        expectLiguligu:options.expectLiguligu,
        baselineResults:options.baselineResults||null
    });
}
const PRE_FIX_CANONICAL_IDS=Array.from({length:117},(_,index)=>
    `canonical-${String(index+1).padStart(3,'0')}`
);

// ---------- 1 fan ----------
add('自摸',1,'Simple self-draw',()=>{
    state.chows=[mkChow(w,2,3,4),mkChow(s,6,7,8),mkChow(t,7,8,9)];
    state.handTiles=[w(7),w(8),w(9),s(2),s(3),s(4),t(6)];
    state.winningTile=t(6);state.isSelfDraw=true;
});
add('花上自摸',1,'Flower draw',()=>{
    const b=baseHand();applyBase(b);state.isFlowerDraw=true;state.isSelfDraw=true;
});
add('槓上自摸',1,'Kong draw',()=>{
    const b=baseHand();applyBase(b);state.isKongDraw=true;state.isSelfDraw=true;
});
add('明槓x1',1,'One open kong',()=>{
    state.handTiles=[w(2),w(3),w(4),w(5),w(6),w(7),w(8),s(2),s(3),s(4),s(6),s(7),s(8)];
    state.openKongs=[mkKong(t,9)];state.winningTile=t(5);
});

// ---------- 2 fan ----------
add('暗槓x1',2,'One concealed kong',()=>{
    state.handTiles=[w(2),w(3),w(4),w(5),w(6),w(7),w(8),s(2),s(3),s(4),s(6),s(7),s(8)];
    state.concealedKongs=[mkKong(t,9)];state.winningTile=t(5);
});
add('無花',2,'No flowers, has honors',()=>{
    state.handTiles=[w(2),w(3),w(4),w(6),w(7),w(8),s(2),s(3),s(4),s(6),s(7),s(8),h(1),h(1),h(1),t(5)];
    state.winningTile=t(5);
});
add('無字',2,'No honors, has flowers',()=>{
    // 5 chows + pair, no honors, with flowers
    state.handTiles=[w(1),w(2),w(3),w(4),w(5),w(6),s(1),s(2),s(3),s(7),s(8),s(9),t(4),t(5),t(6),t(8)];
    state.winningTile=t(8);state.flowers=[fl(1)];
});
add('對碰',2,'Pair wait',()=>{
    state.handTiles=[w(2),w(3),w(4),w(6),w(7),w(8),s(2),s(3),s(4),s(6),s(7),s(8),t(5),t(5),t(5),t(4)];
    state.winningTile=t(5);
});
add('獨獨',2,'Single wait',()=>{
    // Four complete concealed pungs, one eye, and 12 waiting only on 3.
    state.handTiles=[w(7),w(7),w(7),s(8),s(8),s(8),t(4),t(4),t(4),h(1),h(1),h(1),h(5),h(5),w(1),w(2)];
    state.winningTile=w(3);
});
add('將眼',2,'Eye is 2/5/8',()=>{
    const b=baseHand();applyBase(b);// eye=55t (value 5)
});
add('假獨',1,'Fake single wait',()=>{
    // Hand with multiple waits (w2 and w5) but winning tile in single-wait form
    state.handTiles=[w(1),w(2),w(3),w(4),w(5),w(6),w(7),w(8),w(9),s(2),s(3),s(4),t(2),t(2),t(3),t(4)];
    state.winningTile=w(5);
});
add('風牌(北)',1,'Wind pung not seat/round',()=>{
    state.seatWind='東';state.roundWind='南';
    state.handTiles=[w(2),w(3),w(4),s(2),s(3),s(4),t(5),t(6),t(7),h(4),h(4),h(4),t(8),t(8),t(2),t(3)];
    state.winningTile=t(4);
});
add('風牌(南圈)',2,'Wind pung matches round wind',()=>{
    state.seatWind='東';state.roundWind='南';
    state.handTiles=[w(2),w(3),w(4),s(2),s(3),s(4),t(5),t(6),t(7),h(2),h(2),h(2),t(8),t(8),t(2),t(3)];
    state.winningTile=t(4);
});
add('風牌(東圈東位)',3,'Wind pung matches BOTH',()=>{
    state.seatWind='東';state.roundWind='東';
    state.handTiles=[w(2),w(3),w(4),s(2),s(3),s(4),t(5),t(6),t(7),h(1),h(1),h(1),t(8),t(8),t(2),t(3)];
    state.winningTile=t(4);
});
add('元牌(中)',2,'Dragon pung',()=>{
    state.handTiles=[w(2),w(3),w(4),s(2),s(3),s(4),t(5),t(6),t(7),h(5),h(5),h(5),t(8),t(8),t(2),t(3)];
    state.winningTile=t(4);
});

// ---------- 3 fan ----------
add('老少上x1',3,'Same suit 123+789 chow',()=>{
    state.chows=[mkChow(s,1,2,3),mkChow(s,7,8,9)];
    state.handTiles=[w(2),w(3),w(4),w(5),w(6),w(7),t(2),t(3),t(4),t(5),t(5)];
    state.winningTile=null;
    // 2 chows(6)+11 hand=17, no winning tile means allTiles=17
    // Actually we need 17 tiles. 2*3+11=17. But no winning tile.
    // Fix: need winning tile. Remove one hand tile and add winning tile.
    state.handTiles=[w(2),w(3),w(4),w(5),w(6),w(7),t(2),t(3),t(4),t(5)];
    state.winningTile=t(5);
});
add('二相逢x1',3,'Two same-number chows diff suits',()=>{
    state.chows=[mkChow(w,1,2,3),mkChow(s,1,2,3)];
    state.handTiles=[w(7),w(8),w(9),t(4),t(5),t(6),s(2),s(3),s(4),s(7)];
    state.winningTile=s(7);
});

// ---------- 5 fan ----------
add('無字花',5,'No honors AND no flowers',()=>{
    // Exposed pung blocks 門清, terminal blocks 斷么, enough fan to avoid 大雞糊
    state.pungs=[mkPung(s,1)];
    state.chows=[mkChow(w,1,2,3),mkChow(w,4,5,6),mkChow(s,4,5,6)];
    state.handTiles=[t(2),t(3),t(4),t(5)];
    state.winningTile=t(5);
});
add('門清',5,'No exposed, not self-draw',()=>{
    const b=baseHand();applyBase(b);state.isSelfDraw=false;
});
add('平糊',5,'All chows + pair (flower prevents 無字花大平糊 replacement)',()=>{
    state.chows=[mkChow(w,1,2,3),mkChow(w,7,8,9),mkChow(s,1,2,3),mkChow(s,7,8,9)];
    state.handTiles=[t(4),t(5),t(6),t(8)];
    state.winningTile=t(8);state.flowers=[fl(1)];
});
add('宣告聽牌',5,'Declared ready',()=>{
    // Exposed pung blocks 門清, so no 門清大叮
    state.pungs=[mkPung(s,1)];
    state.chows=[mkChow(w,1,2,3),mkChow(t,7,8,9)];
    state.handTiles=[w(4),w(5),w(6),s(7),s(8),s(9),t(4)];
    state.winningTile=t(5);state.isDeclaredReady=true;
});
add('一發',5,'Ippatsu',()=>{
    const b=baseHand();applyBase(b);state.isIppatsu=true;
});
add('一般高',5,'Two identical chows same suit',()=>{
    state.chows=[mkChow(w,1,2,3),mkChow(w,1,2,3)];
    state.handTiles=[s(2),s(3),s(4),s(6),s(7),s(8),t(2),t(3),t(4),t(5),t(5)];
    state.winningTile=null;
    state.handTiles=[s(2),s(3),s(4),s(6),s(7),s(8),t(2),t(3),t(4),t(5)];
    state.winningTile=t(5);
});
add('2暗刻',5,'2 concealed pungs',()=>{
    state.handTiles=[w(2),w(2),w(2),w(5),w(5),w(5),w(8),w(8),s(3),s(4),s(6),s(7),s(8),t(2),t(3),t(4)];
    state.winningTile=t(5);
});
add('兩兄弟',5,'Same-number pungs in 2 suits',()=>{
    state.pungs=[mkPung(w,2),mkPung(s,2)];
    state.chows=[mkChow(w,4,5,6),mkChow(t,5,6,7)];
    state.handTiles=[h(1),h(1),h(1),h(2)];
    state.winningTile=h(2);
});
add('二姊妹',5,'2 consecutive pungs same suit',()=>{
    state.pungs=[mkPung(w,3),mkPung(w,4)];
    state.handTiles=[s(2),s(3),s(4),t(5),t(6),t(7),w(2),w(3),w(4),w(8),w(8)];
    state.winningTile=null;
    state.handTiles=[s(2),s(3),s(4),t(5),t(6),t(7),w(2),w(3),w(4),w(8)];
    state.winningTile=w(8);
});
add('老少碰x1',5,'Same suit 111+999 pungs',()=>{
    state.pungs=[mkPung(s,1),mkPung(s,9)];
    state.handTiles=[w(2),w(3),w(4),w(5),w(6),w(7),t(2),t(3),t(4),t(5),t(5)];
    state.winningTile=null;
    state.handTiles=[w(2),w(3),w(4),w(5),w(6),w(7),t(2),t(3),t(4),t(5)];
    state.winningTile=t(5);
});
add('斷么',5,'No terminals/honors',()=>{
    state.chows=[mkChow(w,2,3,4)];
    state.handTiles=[w(5),w(6),w(7),s(3),s(4),s(5),s(6),s(7),s(8),t(3),t(4),t(4),t(4),t(5)];
    state.winningTile=null;
    state.handTiles=[w(5),w(6),w(7),s(3),s(4),s(5),s(6),s(7),s(8),t(3),t(4),t(4),t(5)];
    state.winningTile=t(4);
});
add('搶槓食糊',5,'Robbing kong',()=>{
    const b=baseHand();applyBase(b);state.isRobbingKong=true;
});
add('明絕',5,'Visible win tile=3, not single wait',()=>{
    const b=baseHand();applyBase(b);state.visibleWinTileCount=3;
});
add('四歸一',5,'All 4 copies used (exposed)',()=>{
    state.pungs=[mkPung(w,5),mkPung(t,8)];
    state.chows=[mkChow(w,3,4,5)];
    state.handTiles=[t(2),t(2),t(3),t(4),t(5),t(6),t(7)];
    state.winningTile=t(8);
});
add('三色步步高',5,'3 ascending chows diff suits',()=>{
    state.chows=[mkChow(w,1,2,3),mkChow(s,2,3,4),mkChow(t,3,4,5)];
    state.handTiles=[w(5),w(6),w(7),s(6),s(7),s(8),t(8)];
    state.winningTile=t(8);
});
add('明雜龍',5,'123+456+789 across suits, exposed',()=>{
    state.chows=[mkChow(w,1,2,3),mkChow(s,4,5,6)];
    state.handTiles=[t(7),t(8),t(9),w(5),w(5),w(5),s(2),s(3),s(4),t(2),t(2)];
    state.winningTile=null;
    state.handTiles=[t(7),t(8),t(9),w(5),w(5),w(5),s(2),s(3),s(4),t(2)];
    state.winningTile=t(2);
});
add('雪上霜(雙響)',5,'Multi win 2',()=>{
    const b=baseHand();applyBase(b);state.isMultiWin=2;
});

// ---------- 8 fan ----------
add('門清自摸',8,'MenQing + self-draw',()=>{
    // All concealed: 3 concealed kongs + pung + pair, NO exposed melds, 17+3=20 tiles
    state.concealedKongs=[mkKong(w,2),mkKong(s,6),mkKong(t,3)];
    state.handTiles=[h(1),h(1),h(1),h(5),h(5),t(8)];
    state.winningTile=t(8);state.isSelfDraw=true;
});
add('小雜兄弟',8,'2 consec pungs diff suits + connected pair',()=>{
    state.pungs=[mkPung(w,3),mkPung(s,4)];
    state.chows=[mkChow(t,2,3,4)];
    state.handTiles=[w(6),w(7),w(8),s(7),s(8),s(9),t(5),t(5)];
    state.winningTile=null;
    state.handTiles=[w(6),w(7),w(8),s(7),s(8),s(9),t(5)];
    state.winningTile=t(5);
});

// ---------- 10 fan ----------
add('雙般高',10,'2 pairs identical chows',()=>{
    state.chows=[mkChow(w,1,2,3),mkChow(w,1,2,3),mkChow(s,4,5,6),mkChow(s,4,5,6)];
    state.handTiles=[t(2),t(3),t(4),t(7),t(7)];
    state.winningTile=null;
    state.handTiles=[t(2),t(3),t(4),t(7)];
    state.winningTile=t(7);
});
add('三相逢x1',10,'Same-number chows all 3 suits',()=>{
    state.chows=[mkChow(w,1,2,3),mkChow(s,1,2,3),mkChow(t,1,2,3)];
    state.handTiles=[w(4),w(5),w(6),t(7),t(8),t(8),t(8)];
    state.winningTile=t(8);
});
add('河底撈魚',10,'Last discard',()=>{
    const b=baseHand();applyBase(b);state.isLastDiscard=true;
});
add('缺一門',10,'Only 2 suits, no honors',()=>{
    state.handTiles=[w(2),w(3),w(4),w(5),w(6),w(7),s(2),s(3),s(4),s(6),s(7),s(8),s(4),s(4),s(5),s(5)];
    state.winningTile=s(5);
});
add('缺五',10,'No 5 tiles, no honors',()=>{
    state.handTiles=[w(2),w(3),w(4),w(6),w(7),w(8),s(2),s(3),s(4),s(6),s(7),s(8),t(2),t(3),t(4),t(6)];
    state.winningTile=t(7);
});
add('明清龍',10,'123+456+789 same suit, exposed',()=>{
    state.chows=[mkChow(w,1,2,3),mkChow(w,4,5,6)];
    state.handTiles=[w(7),w(8),w(9),s(2),s(3),s(4),t(2),t(3),t(4),t(5)];
    state.winningTile=t(5);
},{required:[{name:'明清龍(',score:10,matcher:'prefix',minCount:1,maxCount:1}]});
add('蓋牌',10,'Face down',()=>{
    const b=baseHand();applyBase(b);state.isFaceDown=true;
});
add('雪上冰(三響)',10,'Multi win 3',()=>{
    const b=baseHand();applyBase(b);state.isMultiWin=3;
});
add('絕絕',10,'Visible=3 + single wait',()=>{
    // Concealed 12 waits only on 3; the winning tile is the fourth visible copy.
    state.handTiles=[w(7),w(7),w(7),s(8),s(8),s(8),t(4),t(4),t(4),h(1),h(1),h(1),h(5),h(5),w(1),w(2)];
    state.winningTile=w(3);state.visibleWinTileCount=3;
});
add('十子',10,'10 concealed tiles',()=>{
    state.openKongs=[mkKong(s,5)];
    state.concealedKongs=[mkKong(t,2)];
    state.handTiles=[w(5),w(5),w(5),s(3),s(3),s(3),w(8),w(8),w(8)];
    state.winningTile=w(8);
});
add('鴨糊',10,'Only few non-reward fan + self-draw',()=>{
    state.pungs=[mkPung(t,1)];
    state.chows=[mkChow(w,2,3,4),mkChow(w,6,7,8),mkChow(s,5,6,7)];
    state.handTiles=[h(1),h(2),h(3),h(4)];
    state.winningTile=h(4);state.isSelfDraw=true;
});
add('錦上添花(雙響劈)',10,'MultiWinSelfDraw + multiWin=2',()=>{
    const b=baseHand();applyBase(b);state.isMultiWinSelfDraw=true;state.isMultiWin=2;
});
add('暗雜龍',10,'123+456+789 across suits, concealed',()=>{
    // 3 chows forming dragon pattern across suits + 2 more chows + pair
    state.handTiles=[w(1),w(2),w(3),s(4),s(5),s(6),t(7),t(8),t(9),t(2),t(3),t(4),w(5),w(5),w(5),w(5)];
    state.winningTile=w(5);
});

// ===== Test Runner =====
function tileStr(t){
    if(!t)return 'null';
    const suit=t.type;const v=t.value;
    if(suit===TILE_TYPES.CHARACTERS)return 'w'+v;
    if(suit===TILE_TYPES.BAMBOOS)return 's'+v;
    if(suit===TILE_TYPES.DOTS)return 't'+v;
    if(suit===TILE_TYPES.HONORS)return 'h'+v;
    if(suit===TILE_TYPES.FLOWERS)return 'fl'+v;
    return suit+'-'+v;
}
function meldStr(m){
    if(!m||!m.tiles)return '?';
    return '['+m.tiles.map(tileStr).join(',')+']';
}
function captureSetup(){
    const o={};
    if(state.handTiles.length)o.handTiles=state.handTiles.map(tileStr);
    if(state.winningTile)o.winningTile=tileStr(state.winningTile);
    if(state.chows.length)o.chows=state.chows.map(meldStr);
    if(state.pungs.length)o.pungs=state.pungs.map(meldStr);
    if(state.openKongs.length)o.openKongs=state.openKongs.map(meldStr);
    if(state.concealedKongs.length)o.concealedKongs=state.concealedKongs.map(meldStr);
    if(state.flowers.length)o.flowers=state.flowers.map(tileStr);
    const flags=[];
    ['isSelfDraw','isDeclaredReady','isIppatsu','isLastTileDraw','isLastDiscard','isFlowerDraw',
     'isKongDraw','isRobbingKong','isDoubleKongDraw','isRobbingDoubleKong','isTenhou','isChihou',
     'isTenReady','isChiReady','isFaceDown','isMultiWinSelfDraw'].forEach(flag=>{
        if(state[flag])flags.push(flag);
    });
    if(state.isMultiWin)flags.push('isMultiWin='+state.isMultiWin);
    if(state.visibleWinTileCount)flags.push('visibleWinTileCount='+state.visibleWinTileCount);
    if(state.seatWind!=='東')flags.push('seatWind='+state.seatWind);
    if(state.roundWind!=='東')flags.push('roundWind='+state.roundWind);
    if(state.isDealer)flags.push('isDealer');
    if(flags.length)o.flags=flags;
    return o;
}
function resultMatches(result,spec){
    const matcher=spec.matcher||'exact';
    const nameMatches=matcher==='prefix' ? result.name.startsWith(spec.name) : result.name===spec.name;
    const scoreMatches=!Object.prototype.hasOwnProperty.call(spec,'score')||result.score===spec.score;
    return nameMatches&&scoreMatches;
}
function normalizeResults(results){
    return results.map(({name,score})=>({name,score}));
}
function evaluateAssertions(test,results){
    const violations=[];
    test.required.forEach(spec=>{
        const count=results.filter(result=>resultMatches(result,spec)).length;
        const min=spec.minCount??1;
        const max=spec.maxCount??1;
        if(count<min)violations.push({kind:'missing-required',spec,count});
        else if(count>max)violations.push({kind:'duplicate-target',spec,count});
    });
    test.prohibited.forEach(spec=>{
        const matches=results.filter(result=>resultMatches(result,spec));
        if(matches.length)violations.push({kind:'prohibited-result',spec,count:matches.length,matches});
    });
    if(test.expectLiguligu!==undefined){
        const actualLiguligu=isLiguligu(getAllTiles());
        if(actualLiguligu!==test.expectLiguligu){
            violations.push({kind:'classification-differential',expectedLiguligu:test.expectLiguligu,actualLiguligu});
        }
    }
    if(test.baselineResults){
        const actualNormalized=normalizeResults(results);
        if(JSON.stringify(actualNormalized)!==JSON.stringify(test.baselineResults)){
            violations.push({kind:'preservation-differential',expected:test.baselineResults,actual:actualNormalized});
        }
    }
    return{pass:violations.length===0,violations};
}
function runOracleProbes(){
    const cases=[
        {id:'oracle-exact-pass',expected:true,test:{required:[{name:'目標',score:5}],prohibited:[]},results:[{name:'目標',score:5}]},
        {id:'oracle-wrong-score-rejected',expected:false,test:{required:[{name:'目標',score:5}],prohibited:[]},results:[{name:'目標',score:10}]},
        {id:'oracle-broad-prefix-rejected',expected:false,test:{required:[{name:'純全帶',score:80}],prohibited:[]},results:[{name:'純全帶3',score:80}]},
        {id:'oracle-missing-required-rejected',expected:false,test:{required:[{name:'目標',score:5}],prohibited:[]},results:[]},
        {id:'oracle-prohibited-rejected',expected:false,test:{required:[{name:'目標',score:5}],prohibited:[{name:'無字'}]},results:[{name:'目標',score:5},{name:'無字',score:2}]},
        {id:'oracle-duplicate-rejected',expected:false,test:{required:[{name:'目標',score:5,minCount:1,maxCount:1}],prohibited:[]},results:[{name:'目標',score:5},{name:'目標',score:5}]},
        {id:'oracle-opt-in-prefix-pass',expected:true,test:{required:[{name:'純全帶',score:80,matcher:'prefix'}],prohibited:[]},results:[{name:'純全帶3',score:80}]}
    ];
    const details=cases.map(probe=>{
        const actual=evaluateAssertions(probe.test,probe.results).pass;
        return{id:probe.id,passed:actual===probe.expected,expected:probe.expected,actual};
    });
    return{total:details.length,passed:details.filter(item=>item.passed).length,failed:details.filter(item=>!item.passed).length,details};
}
function detectWithOptionalTrace(test){
    let rawCandidates=null;
    if(!test.traceCandidates)return{results:detectHandTypes(),rawCandidates};
    const originalApplyExclusions=applyExclusions;
    applyExclusions=function(candidates){
        rawCandidates=candidates.map(result=>({...result}));
        return originalApplyExclusions(candidates);
    };
    try{return{results:detectHandTypes(),rawCandidates};}
    finally{applyExclusions=originalApplyExclusions;}
}
function formatResult(result){return `${result.name}(${result.score})`}
function escapeHtml(value){
    return String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
}
function writeCompletion(payload){
    const completion=document.getElementById('test-completion');
    completion.textContent=JSON.stringify(payload);
    window.__TEST_COMPLETION__=payload;
}
function validateTestInventory(){
    const ids=T.map(test=>test.id);
    const uniqueIds=new Set(ids);
    const missingPreFixIds=PRE_FIX_CANONICAL_IDS.filter(id=>!uniqueIds.has(id));
    const duplicateIds=ids.filter((id,index)=>ids.indexOf(id)!==index);
    return{
        passed:missingPreFixIds.length===0&&duplicateIds.length===0,
        expectedPreFixCount:PRE_FIX_CANONICAL_IDS.length,
        registeredPreFixCount:PRE_FIX_CANONICAL_IDS.filter(id=>uniqueIds.has(id)).length,
        missingPreFixIds,duplicateIds,
        preFixCanonicalIds:PRE_FIX_CANONICAL_IDS
    };
}
function runAllTests(executionMode='manual'){
    const tbody=document.querySelector('#results tbody');
    tbody.innerHTML='';
    document.getElementById('test-completion').textContent='';
    const oracleProbes=runOracleProbes();
    const inventory=validateTestInventory();
    const counts={discovered:T.length,executed:0,passed:0,failed:0,errors:0};
    const cases=[];
    const failures=[];
    const executedIds=new Set();
    const sorted=[...T].sort((a,b)=>a.score-b.score||a.id.localeCompare(b.id));
    sorted.forEach((test,i)=>{
        resetState();
        let results=[];
        let rawCandidates=null;
        let setup={};
        let verdict={pass:false,violations:[]};
        let error=null;
        try{
            if(executedIds.has(test.id))throw new Error(`Case executed more than once: ${test.id}`);
            executedIds.add(test.id);
            test.setup();
            setup=captureSetup();
            ({results,rawCandidates}=detectWithOptionalTrace(test));
            verdict=evaluateAssertions(test,results);
            if(verdict.pass)counts.passed++;
            else counts.failed++;
        }catch(e){
            error={name:e.name||'Error',message:e.message||String(e),stack:e.stack||null};
            counts.errors++;
            console.error(`Test "${test.id}" error:`,e);
        }finally{
            counts.executed++;
        }
        const caseResult={
            id:test.id,name:test.name,score:test.score,category:test.category,seed:test.seed,
            preservation:test.preservation,expectLiguligu:test.expectLiguligu,
            baselineResults:test.baselineResults,
            status:error?'error':verdict.pass?'passed':'failed',required:test.required,
            prohibited:test.prohibited,violations:verdict.violations,setup,
            actual:results,rawCandidates,error
        };
        cases.push(caseResult);
        if(caseResult.status!=='passed')failures.push(caseResult);
        const detail=caseResult.status==='passed'?'':`<span class="detail">${escapeHtml(error?error.message:`${verdict.violations.map(v=>v.kind).join(', ')}; got ${results.map(formatResult).join(', ')}`)}</span>`;
        const resultCell=caseResult.status==='passed'?'<span class="pass">✓</span>':'<span class="fail">✗</span>';
        const tr=document.createElement('tr');
        tr.innerHTML=`<td>${i+1}</td><td><code>${escapeHtml(test.id)}</code><br>${escapeHtml(test.name)}${detail}</td><td>${test.score}</td><td>${resultCell}</td><td><pre class="json-setup">${escapeHtml(JSON.stringify(setup,null,1))}</pre></td>`;
        tbody.appendChild(tr);
    });
    const preservationCases=cases.filter(result=>result.preservation);
    const preservation={
        total:preservationCases.length,
        passed:preservationCases.filter(result=>result.status==='passed').length,
        failed:preservationCases.filter(result=>result.status==='failed').length,
        errors:preservationCases.filter(result=>result.status==='error').length,
        ids:preservationCases.map(result=>result.id),
        seeds:preservationCases.map(result=>result.seed),
        baselines:preservationCases.map(result=>({id:result.id,expected:result.baselineResults,actual:normalizeResults(result.actual)}))
    };
    const invariant=counts.discovered===counts.executed&&counts.executed===counts.passed+counts.failed+counts.errors;
    const status=invariant&&inventory.passed&&counts.failed===0&&counts.errors===0&&oracleProbes.failed===0?'success':'failure';
    const payload={
        schemaVersion:TEST_SCHEMA_VERSION,status,executionMode,counts,invariant,
        build:window.__TEST_BUILD_META__||null,
        oracleProbes,inventory,preservation,
        testIds:T.map(test=>test.id),
        amendmentCaseIds:T.filter(test=>test.category.startsWith('v2.7')).map(test=>test.id),
        preservationCaseIds:T.filter(test=>test.preservation).map(test=>test.id),
        cases,failures
    };
    document.getElementById('summary').innerHTML=
        `<span class="pass-count">${counts.passed}</span> passed / <span class="fail-count">${counts.failed}</span> failed / <span class="fail-count">${counts.errors}</span> errors / ${counts.discovered} discovered; oracle probes ${oracleProbes.passed}/${oracleProbes.total}; preservation ${preservation.passed}/${preservation.total}`;
    writeCompletion(payload);
    document.title=`TESTS:${status}:${counts.passed}/${counts.failed}/${counts.errors}/${counts.discovered}`;
    return payload;
}
const runMode=new URLSearchParams(window.location.search).get('run');
if(runMode==='auto'){
    window.addEventListener('DOMContentLoaded',()=>runAllTests('auto'),{once:true});
}else if(runMode==='manual-probe'){
    window.addEventListener('DOMContentLoaded',()=>document.getElementById('run-btn').click(),{once:true});
}
